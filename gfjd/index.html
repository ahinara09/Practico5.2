
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Funcionarios</title>

    <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css}"
          rel="stylesheet">
</head>

<body class="container my-4">

    <h1 class="mb-3">Gestión de Funcionarios</h1>

    <form th:action="@{/funcionarios}"
          th:object="${funcionario}"
          method="post"
          class="row gy-2 gx-2 mb-4">

        <div class="col">
            <input class="form-control"
                   placeholder="Cédula"
                   th:field="*{cedula}"
                   required>
        </div>

        <div class="col">
            <input class="form-control"
                   placeholder="Nombre"
                   th:field="*{nombre}"
                   required>
        </div>

        <div class="col">
            <input class="form-control"
                   placeholder="Teléfono"
                   th:field="*{telefono}"
                   required>
        </div>

        <div class="col">
            <input class="form-control"
                   placeholder="Salario"
                   th:field="*{salarioBase}"
                   required
                   type="number"
                   step="0.01">
        </div>

        <div class="col-auto">
            <button class="btn btn-primary">Agregar</button>
        </div>

    </form>

    <table class="table table-bordered">

        <thead class="table-light">
            <tr>
                <th>Cédula</th>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Salario</th>
                <th>Acción</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="f : ${lista}">

                <td th:text="${f.cedula}">12345678</td>

                <td th:text="${f.nombre}">Ana</td>

                <td th:text="${f.telefono}">099123456</td>

                <td th:text="${#numbers.formatDecimal(f.salarioBase, 1, 'COMMA', 2, 'POINT')}">
                    1200,30
                </td>

                <td>
                    <a th:href="@{/funcionarios/eliminar/{c}(c=${f.cedula})}"
                       class="btn btn-sm btn-danger">
                        X
                    </a>
                </td>

            </tr>

        </tbody>

    </table>

</body>
</html>
